<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access | Sri Shambhu Sha & Sons</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 p-8">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-red-900/30 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-500/20">
                <i class="ph-fill ph-shield-warning text-3xl text-red-500"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Admin Portal</h1>
            <p class="text-sm text-gray-400 mt-1">Restricted Access Area</p>
        </div>

        <div id="error-msg" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/50 text-red-400 text-sm rounded-lg text-center font-medium">
            <!-- Error messages injected here -->
        </div>

        <form id="admin-login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1.5">Admin Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="ph ph-envelope-simple text-gray-500"></i>
                    </div>
                    <input type="email" id="email" required class="w-full bg-gray-900 border border-gray-700 rounded-lg pl-10 p-3 text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all placeholder-gray-600" placeholder="admin@example.com">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1.5">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="ph ph-lock-key text-gray-500"></i>
                    </div>
                    <input type="password" id="password" required class="w-full bg-gray-900 border border-gray-700 rounded-lg pl-10 p-3 text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all placeholder-gray-600" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="login-btn" class="w-full bg-red-600 hover:bg-red-700 text-white py-3.5 rounded-lg font-bold transition-colors shadow-lg shadow-red-900/20 mt-4 flex items-center justify-center gap-2">
                Verify Identity <i class="ph ph-arrow-right"></i>
            </button>
        </form>
        
        <div class="mt-8 pt-6 border-t border-gray-700 text-center">
            <p class="text-xs text-gray-500">&copy; 2026 Sri Shambhu Sha & Sons. All actions are logged.</p>
        </div>
    </div>

    <!-- FIREBASE IMPORT & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBNVAJqAmAqXFLG_pUacvpkhvB99G9u7jc",
            authDomain: "srishambhushaandsons.firebaseapp.com",
            projectId: "srishambhushaandsons",
            storageBucket: "srishambhushaandsons.firebasestorage.app",
            messagingSenderId: "711660800708",
            appId: "1:711660800708:web:1062afe7a0ca5ffde85791",
            measurementId: "G-3EE0MXD090"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById('admin-login-form');
        const btn = document.getElementById('login-btn');
        const errorBox = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="ph ph-spinner-gap animate-spin text-xl"></i> Authenticating...`;
            btn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                // 1. Sign in
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Verify Admin Role strictly
                btn.innerHTML = `<i class="ph ph-spinner-gap animate-spin text-xl"></i> Verifying Access...`;
                const adminDoc = await getDoc(doc(db, "admins", user.uid));
                
                if (adminDoc.exists() && adminDoc.data().role === 'admin') {
                    // Success! Redirect to admin dashboard
                    window.location.replace('admin.html');
                } else {
                    // Valid credentials, but NOT an admin
                    await auth.signOut();
                    throw new Error("You do not have administrative privileges.");
                }

            } catch (error) {
                console.error(error);
                btn.innerHTML = originalText;
                btn.disabled = false;
                
                let msg = "Authentication failed.";
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found') {
                    msg = "Invalid email or password.";
                } else if (error.message) {
                    msg = error.message;
                }
                
                errorBox.innerHTML = `<i class="ph-fill ph-warning-circle"></i> ${msg}`;
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
